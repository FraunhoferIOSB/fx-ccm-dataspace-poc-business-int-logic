services:
  Data-Source:
    image: data-source-image
    container_name: MX-Adapter-Data-Source
    restart: always
    ports:
      - 8222:8000
    networks:
      - MX-Adapter-network
    volumes: 
      - MX-Adapter-volume:/fx
    environment:
      - AAS_SERVER_NETWORK_URL=http://z0008a0043.sfh.edge-device.net/faaast/api/v3.0/
      #https://app-aascore-dev-we-004.azurewebsites.net/
      #http://z0008a0043.sfh.edge-device.net/faaast/api/v3.0/

  OPCUA-Server:
    image: opcua-server-image
    container_name: MX-Adapter-OPCUA-Server
    restart: always
    ports:
      - 4840:4840
    networks:
      - MX-Adapter-network
    volumes: 
      - MX-Adapter-volume:/fx
    environment:
      - DATA_SOURCE_NETWORK_URL=http://MX-Adapter-Data-Source:8000

networks:
  MX-Adapter-network:

volumes:
  MX-Adapter-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /daten/docker-projects/Factory_X_Trumpf_demonstrator/fx-ccm-dataspace-poc-business-int-logic
